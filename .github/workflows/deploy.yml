name: 縁側 (Engawa) 自動配備

on:
  push:
    branches:
      - main # main ブランチにプッシュされた時に起動
  workflow_dispatch: # 手動実行も可能

# GitHub Pages への安全な直接配備に必要なアクセス権限の設定
permissions:
  contents: read
  pages: write
  id-token: write

# 複数同時ビルド時に古いジョブを安全にキャンセルする
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: 依存パッケージのインストール
        run: |
          cd app
          npm ci

      - name: 静的ファイルのコンパイル (環境変数を安全に注入)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: |
          cd app
          npm run build

      - name: GitHub Pages 設定のロード
        uses: actions/configure-pages@v5

      - name: ビルド成果物のアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app/dist' # Viteが出力したPWA成果物ディレクトリ

      - name: GitHub Pages への直接デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
