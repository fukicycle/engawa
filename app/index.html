<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- ネイティブアプリらしい表示のためのメタ情報 -->
    <meta name="theme-color" content="#2c3e1c" />
    <meta name="color-scheme" content="light only" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="縁側" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <title>縁側</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!--
      起動スプラッシュ。
      JSバンドルの読み込み〜認証復元が終わるまでの「白画面」と
      「全画面ローディングカード」を排除し、ネイティブアプリの起動体験に寄せる。
      CSSはインライン化して、外部CSSを待たずに最初のペイントで確実に描画する。
    -->
    <style>
      #engawa-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background-color: #f5efe6;
        background-image: radial-gradient(circle at 10% 20%, rgba(245, 239, 230, 0.5) 0%, rgba(232, 223, 216, 0.7) 90.1%);
        font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
        /* ノッチ端末で中央が上寄りに見えないように安全領域を反映 */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        opacity: 1;
        transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* アプリ側の準備が整ったら静かにフェードアウトする */
      #engawa-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #engawa-splash .splash-mark {
        width: 76px;
        height: 76px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #3e532b;
        background: rgba(82, 110, 71, 0.1);
        border: 1px solid rgba(82, 110, 71, 0.2);
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04);
        animation: splashBreathe 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }

      #engawa-splash .splash-name {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.35em;
        text-indent: 0.35em;
        color: #1d2a13;
      }

      @keyframes splashBreathe {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.06); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        #engawa-splash .splash-mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="engawa-splash" role="status" aria-label="縁側を起動しています">
      <div class="splash-mark">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2c0 0-8 4-8 10a8 8 0 0 0 16 0c0-6-8-10-8-10z" fill="currentColor" fill-opacity="0.08" />
          <path d="M12 2v18" />
          <path d="M12 8c1.5-1 3-1 3-1M12 12c-1.5-1-3-1-3-1M12 15c1.5-1 3-1 3-1" />
        </svg>
      </div>
      <span class="splash-name">縁側</span>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
